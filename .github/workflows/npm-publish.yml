# Publishes all four public npm packages with one trigger.
# Requires repo secret: NPM_TOKEN (granular token with publish + 2FA bypass if org requires it)

name: npm-publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - "."
          - "packages/blackjack-compression"
          - "packages/spl-pay-per-suite"
          - "packages/tru8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm test --if-present
        working-directory: ${{ matrix.pkg }}
      - run: npm publish --access public
        working-directory: ${{ matrix.pkg }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
