<style>
body{font-family:system-ui,sans-serif;background:#050b16;color:#eef4fb;padding:40px 20px;max-width:42rem;margin:0 auto;line-height:1.5}
h1{color:#e8c547;font-size:1.35rem}
.box{background:#0c1524;border:1px solid rgba(61,214,198,.25);border-radius:12px;padding:14px;word-break:break-all;font-family:ui-monospace,monospace;font-size:.82rem;color:#5ef0df;margin:12px 0}
.muted{color:#8fa3b8}
.ok{color:#3ecf8e}.err{color:#ff8a7a}
button{background:linear-gradient(180deg,#5ef0df,#3dd6c6);color:#031018;border:0;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}
</style>
<link rel="stylesheet" href="/assets/chrome.css?v=1"/>
</head>
<body>
  <h1 id="title">X connect</h1>
  <p class="muted" id="msg">Reading callback…</p>
  <div class="box" id="urlbox" style="display:none"></div>
  <p><button type="button" id="copy" style="display:none">Copy full URL</button></p>
  <p class="muted">Paste that URL back in the lab chat (or to the engineer). Do not post it publicly — it is a one-time login code.</p>
  <p><a href="/" style="color:#5ef0df">← Home</a></p>
<script>
(function () {
  var u = location.href;
  var q = new URLSearchParams(location.search);
  var code = q.get("code");
  var err = q.get("error");
  var title = document.getElementById("title");
  var msg = document.getElementById("msg");
  var box = document.getElementById("urlbox");
  var btn = document.getElementById("copy");
  if (err) {
    title.textContent = "Auth failed";
    title.className = "err";
    msg.textContent = "Error: " + err + (q.get("error_description") ? " — " + q.get("error_description") : "");
    return;
  }
  if (!code) {
    title.textContent = "Waiting for X";
    msg.innerHTML = "This page is the OAuth callback. Open the authorize link first. After you approve, X will send you back here with a code.";
    return;
  }
  title.textContent = "Connected — send this URL back";
  title.className = "ok";
  msg.textContent = "Copy the box below and paste it in chat so we can finish login.";
  box.style.display = "block";
  box.textContent = u;
  btn.style.display = "inline-block";
  btn.onclick = function () {
    navigator.clipboard.writeText(u).then(function () {
      btn.textContent = "Copied";
    });
  };
})();
</script>
<script src="/assets/chrome.js?v=1" defer></script>
</body>
</html>
