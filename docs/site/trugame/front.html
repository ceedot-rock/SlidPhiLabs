<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Front — five warriors · Slid Phi Labs</title>
  <meta name="description" content="Command five warriors. Drill them on the thirteen chapters. Take the field. TruGame Pass $12 / $79."/>
  <meta name="theme-color" content="#12100c"/>
  <meta name="robots" content="index,follow"/>
  <meta name="agentic" content="true"/>
  <link rel="canonical" href="https://www.slidphilabs.com/trugame/front"/>
  <link rel="icon" type="image/jpeg" href="https://www.slidphilabs.com/assets/logos/logo-slid-phi-labs.jpg"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Slid Phi Labs"/>
  <meta property="og:title" content="Front — five warriors"/>
  <meta property="og:description" content="A war. Drill the host. Command the blow. Not a menu."/>
  <meta property="og:url" content="https://www.slidphilabs.com/trugame/front"/>
  <meta property="og:image" content="https://www.slidphilabs.com/assets/slid-phi-labs-master.jpg"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Front — five warriors"/>
  <meta name="twitter:description" content="Trained on the thirteen chapters. Fought by warriors."/>
  <meta name="twitter:image" content="https://www.slidphilabs.com/assets/slid-phi-labs-master.jpg"/>
  <link rel="stylesheet" href="/assets/chrome.css?v=10"/>
  <style>
    :root { --bg:#12100c; --ink:#e8dfc8; --mut:#8a806c; --line:#3a3428; --go:#c4a35a; --bad:#a34538; --you:#6a8f5a; --them:#8f5a5a; }
    body { background:var(--bg); color:var(--ink); }
    .war { max-width:52rem; margin:0 auto; padding:1rem 1rem 3rem; font:15px/1.4 "IBM Plex Sans", system-ui, sans-serif; }
    .war h1 { font:650 1.6rem/1.15 Georgia, serif; letter-spacing:.04em; margin:.2rem 0 .4rem; }
    .mut { color:var(--mut); }
    .row { display:flex; flex-wrap:wrap; gap:.6rem; }
    .card { border:1px solid var(--line); background:#1a1712; padding:.7rem .8rem; flex:1; min-width:9rem; }
    .card.dead { opacity:.4; }
    .card.on { outline:1px solid var(--go); }
    .card h3 { margin:0 0 .2rem; font-size:1rem; }
    .role { font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); }
    .field { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:1rem 0; }
    .slot { border:1px dashed var(--line); min-height:4.4rem; padding:.4rem; text-align:center; font-size:.85rem; }
    .slot.you { background:#182016; border-color:var(--you); }
    .slot.them { background:#201616; border-color:var(--them); }
    .slot.on { outline:2px solid var(--go); }
    .war button { font:inherit; background:#241f18; color:var(--ink); border:1px solid var(--line); padding:.35rem .6rem; margin:.15rem .15rem 0 0; cursor:pointer; }
    .war button.pri { background:var(--go); color:#16130e; border:0; font-weight:700; }
    .log { max-height:10rem; overflow:auto; font-size:.9rem; color:var(--mut); }
    .log div { margin:.25rem 0; }
    .hp { height:6px; background:#2a241c; margin:.35rem 0; }
    .hp i { display:block; height:100%; background:var(--you); }
    .them .hp i, .foe .hp i { background:var(--them); }
  </style>
</head>
<body>
  <div class="war">
    <p class="mut">FRONT · FIVE WARRIORS · THE BOOK</p>
    <h1>Command the host.</h1>
    <p class="mut" id="status">Drill a warrior on a chapter. Then take the field.</p>
    <p class="mut" id="meta"></p>

    <h2 class="mut" style="font-size:.8rem;letter-spacing:.12em;">YOUR HOST</h2>
    <div class="row" id="you"></div>

    <h2 class="mut" style="font-size:.8rem;letter-spacing:.12em;margin-top:1.2rem;">DRILL — THIRTEEN CHAPTERS</h2>
    <div id="book"></div>

    <p class="row" style="margin-top:.8rem">
      <button class="pri" id="deploy" type="button">Take the field</button>
      <button id="again" type="button">New war</button>
    </p>

    <div class="field" id="enemyField"></div>
    <div class="field" id="yourField"></div>

    <h2 class="mut" style="font-size:.8rem;letter-spacing:.12em;">COMMAND</h2>
    <div id="blows"></div>
    <p class="mut">Click a ground, then a blow. They answer.</p>
    <div class="log" id="log"></div>
    <p class="mut" style="margin-top:1rem"><a href="/trugame">Engine seats</a> · Month $12 · Year $79</p>
  </div>
  <script src="/assets/chrome.js?v=10" defer></script>
  <script type="module">
    import { seedWar, drill, deploy, command, portrait, BOOK, STRATAGEMS, SLOTS, restart } from "./front-engine.js?v=11";
    let g = seedWar(27);
    let pickSlot = 2;
    const $ = (id) => document.getElementById(id);

    function bars(w) {
      const pct = Math.max(0, Math.min(100, (w.cell.strength / 1.6) * 100));
      return `<div class="hp"><i style="width:${pct}%"></i></div>`;
    }

    function paint() {
      $("meta").textContent = `Day ${g.day} · wagons ${g.supply} · round ${g.round || "—"} · ${g.over ? (g.over === "win" ? "YOU HOLD" : "HOST BROKEN") : g.phase}`;
      $("status").textContent = g.log[0] || "";
      $("you").innerHTML = g.you.map((w, i) => {
        const p = portrait(w);
        return `<div class="card ${w.cell.alive ? "" : "dead"} ${g.selected===i?"on":""}" data-w="${i}">
          <div class="role">${p.role}</div>
          <h3>${p.name}</h3>
          ${bars(w)}
          <div class="mut">${p.drills.slice(0,3).join(" · ") || "untrained"} · wounds ${p.wounds}</div>
        </div>`;
      }).join("");
      $("you").querySelectorAll("[data-w]").forEach((el) => {
        el.onclick = () => { g.selected = Number(el.dataset.w); paint(); };
      });
      $("book").innerHTML = BOOK.map((m) => `<button data-m="${m.id}" title="${m.line}">${m.ch}. ${m.name}</button>`).join("");
      $("book").querySelectorAll("button").forEach((b) => {
        b.onclick = () => { drill(g, g.selected, b.dataset.m); paint(); };
      });
      $("enemyField").innerHTML = SLOTS.map((s, i) => {
        const w = g.enemyField[i];
        return `<div class="slot them">${s.name}<br><b>${w ? w.name : "—"}</b>${w ? bars(w) : ""}</div>`;
      }).join("");
      $("yourField").innerHTML = SLOTS.map((s, i) => {
        const w = g.field[i];
        return `<div class="slot you ${pickSlot===i?"on":""}" data-s="${i}">${s.name}<br><b>${w ? w.name : "—"}</b>${w ? bars(w) : ""}</div>`;
      }).join("");
      $("yourField").querySelectorAll("[data-s]").forEach((el) => {
        el.onclick = () => { pickSlot = Number(el.dataset.s); paint(); };
      });
      $("blows").innerHTML = STRATAGEMS.map((s) => `<button class="pri" data-b="${s.id}">${s.name}</button>`).join("");
      $("blows").querySelectorAll("button").forEach((b) => {
        b.onclick = () => { command(g, b.dataset.b, pickSlot); paint(); };
      });
      $("log").innerHTML = g.log.slice(0, 8).map((l) => `<div>${l}</div>`).join("");
      $("deploy").disabled = g.phase !== "drill" || !!g.over;
    }

    $("deploy").onclick = () => {
      deploy(g, [0, 1, 2, 3, 4]);
      paint();
    };
    $("again").onclick = () => { g = restart(); pickSlot = 2; paint(); };
    paint();
  </script>
</body>
</html>
