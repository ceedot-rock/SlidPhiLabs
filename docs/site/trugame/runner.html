  <style>
    html, body { background:#0b0c08; margin:0; height:100%; overflow:hidden; }
    #stage { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:pointer; }
    .hud-note {
      position:fixed; bottom:max(12px, env(safe-area-inset-bottom));
      right:max(16px, env(safe-area-inset-right)); z-index:5;
      color:#8a806c; font:12px/1.3 sans-serif;

<body>
  <canvas id="stage" aria-label="TruGame runner"></canvas>
  <main id="main" hidden></main>
  <p class="hud-note"><a href="/trugame">Engine</a> · $12 / $79</p>
  <script type="module">
    import { seedRun, step, jump, slide, dash } from "./runner-engine.js?v=14";
    import { createView } from "./runner-view3d.js?v=14";
    import * as audio from "./runner-audio.js?v=14";
    const c = document.getElementById("stage");
    const view = createView(c);
    let g = seedRun();
    let last = performance.now();
    let audioOn = false;

    function armAudio() {
      if (audioOn) return;
      audio.unlock();
      audioOn = true;
    }

    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      step(g, dt);
      if (audioOn) audio.drone(g.host.strength);
      view.sync(g);
      view.render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function tap(y) {
      armAudio();
      if (!g.alive) { g = seedRun(); return; }
      if (y > innerHeight * 0.72) { slide(g); audio.onSlide(); }
      else { jump(g); audio.onJump(); }
    }
    addEventListener("keydown", (e) => {
      if (e.repeat) return;
      armAudio();
      if (!g.alive && (e.code === "Space" || e.code === "Enter")) { g = seedRun(); return; }
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); jump(g); audio.onJump(); }
      if (e.code === "ArrowDown" || e.code === "KeyS") { e.preventDefault(); slide(g); audio.onSlide(); }
      if (e.code === "ShiftLeft" || e.code === "ShiftRight" || e.code === "KeyD") { dash(g); audio.onDash(); }
    });
    c.addEventListener("pointerdown", (e) => tap(e.clientY));
  </script>
