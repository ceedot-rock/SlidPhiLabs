<!DOCTYPE html>
<html lang="en">
<head>
<link rel="alternate" type="application/json" href="https://www.slidphilabs.com/api/agent"/>
<link rel="alternate" type="text/plain" href="https://www.slidphilabs.com/llms.txt"/>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Your lab account — Slid Phi Labs</title>
<meta name="description" content="Your Slid Phi Labs account. Open CuNi Studio, Agent-Rider, Chamber, L33tSaaS, Overlord Eye, and TEACHAiD."/>
<link rel="canonical" href="https://www.slidphilabs.com/account"/>
<link rel="icon" href="https://www.slidphilabs.com/assets/logos/logo-slid-phi-labs.jpg"/>
<meta name="robots" content="noindex,follow"/>
<meta name="agentic" content="true"/>
<meta property="og:site_name" content="Slid Phi Labs"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Your lab account — Slid Phi Labs"/>
<meta property="og:description" content="One account. Every product door."/>
<meta property="og:image" content="https://www.slidphilabs.com/assets/slid-phi-labs-master.jpg"/>
<meta property="og:url" content="https://www.slidphilabs.com/account"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Your lab account — Slid Phi Labs"/>
<meta name="twitter:description" content="One account. Every product door."/>
<meta name="twitter:image" content="https://www.slidphilabs.com/assets/slid-phi-labs-master.jpg"/>
<link rel="stylesheet" href="/assets/chrome.css?v=3"/>
</head>
<body>
<main id="main" style="max-width:36rem;margin:2rem auto;padding:0 1.1rem 3rem">
  <h1 style="font-size:1.8rem">You’re in</h1>
  <p id="who" style="color:#5c6570"></p>
  <p>Same login on every door (opens already signed in):</p>
  <ul id="doors" style="line-height:1.9"></ul>
  <h2 style="font-size:1.1rem;margin-top:1.8rem">Change password</h2>
  <form id="pw" style="display:grid;gap:.55rem;max-width:22rem">
    <input name="old_password" type="password" placeholder="Current password" required/>
    <input name="new_password" type="password" placeholder="New password (8+)" minlength="8" required/>
    <button type="submit">Update password</button>
  </form>
  <p id="pwerr" style="color:#b42318;min-height:1.1em"></p>
  <p><button type="button" id="pk">Add a passkey</button> <span id="pkerr"></span></p>
  <p><button type="button" id="out">Log out</button></p>
</main>
<script src="/assets/chrome.js?v=3" defer></script>
<script src="/assets/lab-auth.js?v=3"></script>
<script>
(async () => {
  const u = await SPLAuth.me();
  if (!u) { location.href = "/login?next=/account"; return; }
  document.getElementById("who").textContent = u.name + " · " + u.email;
  const labels = { studio: "CuNi Studio", rider: "Agent-Rider", chamber: "Chamber", box: "24-hour try", l33tsaas: "L33tSaaS", overlord: "Overlord Eye", teachaid: "TEACHAiD" };
  const tok = SPLAuth.token();
  document.getElementById("doors").innerHTML = Object.entries(u.doors).map(([k, href]) =>
    "<li><a href=\"" + SPLAuth.withToken(href, tok) + "\">" + (labels[k] || k) + "</a></li>"
  ).join("");
  document.getElementById("out").onclick = () => SPLAuth.logout();
  document.getElementById("pk").onclick = async () => {
    const el = document.getElementById("pkerr");
    el.textContent = "";
    try {
      const j = await SPLAuth.passkeyRegister();
      if (!j.ok) { el.textContent = j.error || "Could not add passkey"; return; }
      el.textContent = "Passkey saved.";
    } catch {
      el.textContent = "Passkey cancelled or not available.";
    }
  };
  document.getElementById("pw").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const err = document.getElementById("pwerr");
    err.textContent = "";
    const r = await fetch("/api/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + SPLAuth.token() },
      body: JSON.stringify({
        action: "change_password",
        old_password: fd.get("old_password"),
        new_password: fd.get("new_password"),
      }),
    });
    const j = await r.json();
    if (!j.ok) { err.textContent = "Could not update password."; return; }
    if (j.token) localStorage.setItem("spl_lab_token", j.token);
    err.style.color = "#0f6f73";
    err.textContent = "Password updated.";
    e.target.reset();
  });
})();
</script>
</body>
</html>
